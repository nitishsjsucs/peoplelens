# Production warehouse. Uses Application Default Credentials
# (`gcloud auth application-default login`). Run through
# `uv run pl dbt --dialect bigquery ...`, which requires GCP_PROJECT_ID.
peoplelens:
  target: bigquery
  outputs:
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: peoplelens
      location: US
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 600
      job_retries: 1
