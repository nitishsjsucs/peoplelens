# Dev-only templates (ids D-*): the only source of few-shot examples and prompt
# iteration. Disjoint from answerable.yaml (template ids and normalized text).
# Same fields as answerable.yaml. `fewshot: true` marks templates whose first
# generated item becomes a few-shot example (worker/src/generated/fewshot.json).

templates:
  - id: D-HC-01
    metric: headcount
    text: "Give me the current employee count{time}"
    time: [default]
    fewshot: true
  - id: D-HC-02
    metric: headcount
    text: "Number of people per {gb}{time}"
    group_by: [[location], [job_level]]
    time: [end_of_year, default]
    fewshot: true
  - id: D-HC-03
    metric: headcount
    text: "Staff count for the {loc} office{time}"
    filters: [location]
    time: [year, now]
  - id: D-HC-04
    metric: headcount
    text: "Headcount each month{time}"
    grain: month
    time: [half, quarter]
    fewshot: true
  - id: D-HC-05
    metric: headcount
    text: "People in {dept} split by {gb}{time}"
    filters: [department]
    group_by: [[location], [job_level]]
    time: [default]
  - id: D-FTE-01
    metric: fte
    text: "Full-time equivalent total{time}"
    time: [end_of_year, default]
    fewshot: true
  - id: D-FTE-02
    metric: fte
    text: "FTE split across {gb}{time}"
    group_by: [[location], [tenure_band]]
    time: [default]
  - id: D-FTE-03
    metric: fte
    text: "FTE in {loc} by {gb}{time}"
    filters: [location]
    group_by: [[job_level], [employment_type]]
    time: [default]
  - id: D-TO-01
    metric: turnover_rate
    text: "Attrition rate{time}"
    time: [year, quarter]
    fewshot: true
  - id: D-TO-02
    metric: turnover_rate
    text: "Leavers rate per {gb}{time}"
    group_by: [[location], [tenure_band]]
    time: [year]
    fewshot: true
  - id: D-TO-03
    metric: turnover_rate
    text: "Turnover for the {dept} team{time}"
    filters: [department]
    time: [last_year, this_year]
  - id: D-TO-04
    metric: turnover_rate
    text: "Turnover per quarter{time}"
    grain: quarter
    time: [range]
  - id: D-OA-01
    metric: offer_acceptance_rate
    text: "Share of offers accepted{time}"
    time: [year, half]
    fewshot: true
  - id: D-OA-02
    metric: offer_acceptance_rate
    text: "Offer acceptance split by {gb}{time}"
    group_by: [[location], [job_level]]
    time: [full]
  - id: D-OA-03
    metric: offer_acceptance_rate
    text: "Acceptance of {level} offers{time}"
    filters: [job_level]
    time: [full]
  - id: D-TTF-01
    metric: time_to_fill_days
    text: "Average days to hire{time}"
    time: [year, this_year]
    fewshot: true
  - id: D-TTF-02
    metric: time_to_fill_days
    text: "Days to fill per {gb}{time}"
    group_by: [[location], [job_level]]
    time: [full]
  - id: D-TTF-03
    metric: time_to_fill_days
    text: "Fill time for {loc} roles{time}"
    filters: [location]
    time: [year]
  - id: D-COMP-01
    metric: compensation_summary
    text: "Typical base salary{time}"
    time: [default, end_of_year]
    fewshot: true
  - id: D-COMP-02
    metric: compensation_summary
    text: "Average and median pay per {gb}{time}"
    group_by: [[job_level], [location]]
    time: [default]
    fewshot: true
  - id: D-COMP-03
    metric: compensation_summary
    text: "Salaries for {level} staff in {loc}{time}"
    filters: [job_level, location]
    time: [default]

