# Hand-written DuckDB SQL for the text-to-SQL baseline's few-shot examples.
# Each is checked against the reference implementation by tests/py/test_baseline_guard.py.
baseline_sql:
  - question: "Headcount by location at the end of 2024"
    spec: {metric: headcount, group_by: [location], grain: none, start: "2024-01-01", end: "2024-12-31", filters: {}}
    sql: |
      SELECT location, SUM(is_active_eom) AS headcount
      FROM sem_workforce_monthly
      WHERE month_start = (SELECT MAX(month_start) FROM sem_workforce_monthly WHERE month_start BETWEEN DATE '2024-01-01' AND DATE '2024-12-31')
      GROUP BY location
  - question: "Turnover rate in 2024"
    spec: {metric: turnover_rate, group_by: [], grain: none, start: "2024-01-01", end: "2024-12-31", filters: {}}
    sql: |
      SELECT SUM(is_termination) / (SUM(is_active_eom) / COUNT(DISTINCT month_start)) AS turnover_rate
      FROM sem_workforce_monthly
      WHERE month_start BETWEEN DATE '2024-01-01' AND DATE '2024-12-31'
  - question: "Offer acceptance rate by job level in 2025"
    spec: {metric: offer_acceptance_rate, group_by: [job_level], grain: none, start: "2025-01-01", end: "2025-12-31", filters: {}}
    sql: |
      SELECT job_level, SUM(is_accepted) * 1.0 / COUNT(*) AS offer_acceptance_rate
      FROM sem_offers
      WHERE offer_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
      GROUP BY job_level
  - question: "Average time to fill in San Jose by quarter of 2025"
    spec: {metric: time_to_fill_days, group_by: [], grain: quarter, start: "2025-01-01", end: "2025-12-31", filters: {location: [San Jose]}}
    sql: |
      SELECT DATE_TRUNC('quarter', filled_date) AS period, AVG(days_to_fill) AS time_to_fill_days
      FROM sem_requisitions
      WHERE location = 'San Jose' AND filled_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
      GROUP BY 1
  - question: "Average and median base salary by department at the end of 2025"
    spec: {metric: compensation_summary, group_by: [department], grain: none, start: "2025-12-01", end: "2025-12-31", filters: {}}
    sql: |
      SELECT department,
             AVG(CASE WHEN is_active_eom = 1 THEN base_salary_eom END) AS avg_base_salary,
             MEDIAN(CASE WHEN is_active_eom = 1 THEN base_salary_eom END) AS median_base_salary
      FROM sem_workforce_monthly
      WHERE month_start = DATE '2025-12-01'
      GROUP BY department
  - question: "Total FTE for part-time employees right now"
    spec: {metric: fte, group_by: [], grain: none, start: "2025-12-01", end: "2025-12-31", filters: {employment_type: [part_time]}}
    sql: |
      SELECT SUM(CASE WHEN is_active_eom = 1 THEN fte_eom ELSE 0 END) AS fte
      FROM sem_workforce_monthly
      WHERE month_start = DATE '2025-12-01' AND employment_type = 'part_time'
